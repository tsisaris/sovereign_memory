[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign_memory_service"
version = "0.1.0"
description = "Owner service for sovereign_memory."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.25.1",
    "duckdb_sqlalchemy_async"
]

[tool.hatch.build.targets.wheel]
packages = ["service"]
