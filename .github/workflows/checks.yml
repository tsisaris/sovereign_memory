# Runs on GitHub's own machines for every pull request and every push to main.
# Everything installs from public package indexes, so nothing depends on the
# laptop. When this fails on a pull request Jules created, Jules receives the
# failure and fixes it inside the same task.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gating:
    name: gating checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: install the project (sovereign_memory, Python 3.12) and its checkers
        run: |
          uv run python -c 'import sys; assert f"{sys.version_info.major}.{sys.version_info.minor}" == "3.12", f"Expected Python 3.12 for environment sovereign_memory, got {sys.version}"'
          uv sync --group dev
      - name: every check in .pre-commit-config.yaml
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: every import declared, every declaration used (deptry)
        run: |
          set -o pipefail
          uv run deptry . tests 2>&1 | tee deptry_output.txt
          if grep -q '^Assuming' deptry_output.txt; then
            echo "FAIL: deptry guessed a package's module name instead of reading it from an installed package."
            exit 1
          fi
      - name: tests
        run: |
          set +e
          uv run coverage run -m pytest
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            if find . -name '*.py' -print -quit | grep -q .; then
              echo "FAIL: ./ holds code but no test was collected from tests/."
              exit 1
            fi
            echo "NO CODE AND NO TESTS YET: nothing to test in an empty project."
            exit 0
          fi
          exit "$status"

  advisory:
    name: advisory checks (reported, never blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: unused code (vulture)
        run: uvx --from vulture==2.16 vulture . --min-confidence 80
      - name: complexity (radon)
        run: |
          uvx --from radon==6.0.1 radon cc -n C .
          uvx --from radon==6.0.1 radon mi -n B .
      - name: rule files (semgrep)
        run: uvx --from semgrep==1.172.0 semgrep scan --config rules --metrics off --error .
