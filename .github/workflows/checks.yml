# Runs on the repository's self-hosted runner on every pull request and every push to main.
# Runs the installed deterministic checking suite configured in pyproject.toml and
# .pre-commit-config.yaml. Green allows GitHub auto-merge to merge; red writes one
# judgment packet into local/packets/ with numbered options and stops.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  UV_PROJECT_ENVIRONMENT: /tmp/uv-sovereign-memory-${{ github.run_id }}-${{ github.job }}

jobs:
  gating:
    name: gating checks
    runs-on: ${{ vars.LAPTOP_RUNNER_HEARTBEAT != '' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: install the project (sovereign_tools) and its checkers
        run: |
          set -o pipefail
          uv sync --group dev 2>&1 | tee -a gating_checks.log
      - name: every check in .pre-commit-config.yaml
        run: |
          set -o pipefail
          uv run pre-commit run --all-files --show-diff-on-failure 2>&1 | tee -a gating_checks.log
      - name: every import declared, every declaration used (deptry)
        run: |
          set -o pipefail
          uv run deptry src tests 2>&1 | tee deptry_output.txt | tee -a gating_checks.log
          if grep -q '^Assuming' deptry_output.txt; then
            echo "FAIL: deptry guessed a package's module name instead of reading it from an installed package." | tee -a gating_checks.log
            exit 1
          fi
      - name: tests
        run: |
          set +e
          uv run coverage run -m pytest > pytest_output.txt 2>&1
          status=$?
          cat pytest_output.txt | tee -a gating_checks.log
          set -e
          if [ "$status" -eq 5 ]; then
            if find src -name '*.py' -print -quit | grep -q .; then
              echo "FAIL: src/ holds code but no test was collected from tests/." | tee -a gating_checks.log
              exit 1
            fi
            echo "NO CODE AND NO TESTS YET: nothing to test in an empty project." | tee -a gating_checks.log
            exit 0
          fi
          exit "$status"
      - name: write judgment packet on red
        if: failure() && github.event_name == 'pull_request'
        run: |
          mkdir -p local/packets
          packet="local/packets/pr_${{ github.event.pull_request.number }}_${{ github.sha }}.md"
          {
            echo "# Judgment Packet — PR #${{ github.event.pull_request.number }} (${{ github.head_ref }})"
            echo ""
            echo "- **Repository:** \`${{ github.repository }}\`"
            echo "- **Pull Request:** #${{ github.event.pull_request.number }}"
            echo "- **Branch:** \`${{ github.head_ref }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Workflow Run:** \`${{ github.run_id }}\`"
            echo "- **Status:** RED (\`gating checks\` failed)"
            echo ""
            echo "## Failed Check Output (Tail)"
            echo '```text'
            tail -n 80 gating_checks.log 2>/dev/null || echo "gating_checks.log unavailable"
            echo '```'
            echo ""
            echo "## Options (pick one number)"
            echo "1. **send_back** — Send the failed check output back to the author/session on branch \`${{ github.head_ref }}\` to fix the reported deterministic violation."
            echo "2. **hand_to** — Hand this pull request and failure output to another coding window to repair."
            echo "3. **set_aside** — Close or hold PR #${{ github.event.pull_request.number }} without merging."
          } > "$packet"
          if [ -n "${ACTIONS_RUNNER_HOOK_JOB_STARTED:-}" ]; then
            projects_root="$(cd "$(dirname "$ACTIONS_RUNNER_HOOK_JOB_STARTED")/../.." && pwd)"
            target_dir="$projects_root/${GITHUB_REPOSITORY#*/}/local/packets"
            mkdir -p "$target_dir"
            cp -f "$packet" "$target_dir/"
            echo "Wrote judgment packet to $target_dir/$(basename "$packet")"
          fi
      - name: clean temporary uv environment
        if: always()
        run: rm -rf "$UV_PROJECT_ENVIRONMENT"

  advisory:
    name: advisory checks (reported, never blocking)
    runs-on: ${{ vars.LAPTOP_RUNNER_HEARTBEAT != '' && 'self-hosted' || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: install the advisory checkers
        run: uv sync --only-group advisory
      - name: unused code (vulture)
        run: uv run --no-sync vulture src --min-confidence 80
      - name: complexity (radon)
        run: |
          uv run --no-sync radon cc -n C src
          uv run --no-sync radon mi -n B src
      - name: rule files (semgrep)
        run: uv run --no-sync semgrep scan --config rules --metrics off --error src
      - name: clean temporary uv environment
        if: always()
        run: rm -rf "$UV_PROJECT_ENVIRONMENT"
